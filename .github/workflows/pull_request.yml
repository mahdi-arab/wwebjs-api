name: Security checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:offline
      - name: Install the production dependency tree
        run: npm ci --omit=dev --omit=optional --ignore-scripts
      - name: Check runtime without optional dependencies
        run: node scripts/check-production.cjs
      - name: Audit the production dependency tree
        run: npm audit --omit=dev --omit=optional
